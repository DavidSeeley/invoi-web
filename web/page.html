<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netsirv SOP & Document Ecosystem - Page</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050b16;
        --panel: rgba(7, 23, 42, 0.9);
        --text: #f4f8ff;
        --muted: #9fb2c7;
        --cyan: #26e4ff;
        --line: rgba(45, 226, 255, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% 10%, rgba(38, 228, 255, 0.12), transparent 28%),
          radial-gradient(circle at 88% 8%, rgba(168, 85, 247, 0.13), transparent 30%),
          var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body.light {
        color-scheme: light;
        --bg: #eef4fb;
        --panel: rgba(255, 255, 255, 0.92);
        --text: #0d1b2e;
        --muted: #53667d;
        --cyan: #007a99;
        --line: rgba(0, 119, 181, 0.24);
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 16px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        backdrop-filter: blur(18px);
      }

      .tabs {
        position: sticky;
        top: 61px;
        z-index: 1;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 90%, transparent);
        backdrop-filter: blur(18px);
      }

      .section-pages {
        position: sticky;
        top: 120px;
        z-index: 1;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 8px 18px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 86%, transparent);
        backdrop-filter: blur(18px);
      }

      .section-heading {
        min-width: 220px;
        max-width: 360px;
        flex: 0 0 auto;
        padding-right: 12px;
        border-right: 1px solid var(--line);
      }

      .section-heading strong {
        display: block;
        color: var(--text);
        font-size: 13px;
        line-height: 1.2;
      }

      .section-heading span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      .title {
        min-width: 0;
      }

      .brand {
        color: var(--cyan);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.14em;
      }

      h1 {
        margin: 2px 0 0;
        overflow: hidden;
        color: var(--text);
        font-size: 17px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .pager,
      nav {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      nav {
        justify-content: flex-end;
      }

      a,
      button,
      select {
        min-height: 36px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
        background: color-mix(in srgb, var(--panel) 80%, transparent);
      }

      a,
      button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        cursor: pointer;
      }

      .tab {
        flex: 0 0 auto;
        min-width: 168px;
        max-width: 230px;
        justify-content: flex-start;
        border-radius: 10px;
        padding: 9px 11px;
        text-align: left;
      }

      .tab[aria-selected="true"] {
        border-color: var(--cyan);
        color: var(--cyan);
        box-shadow: 0 0 18px color-mix(in srgb, var(--cyan) 22%, transparent);
      }

      .tab span {
        display: block;
        overflow: hidden;
        color: inherit;
        font-size: 11px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tab strong {
        display: block;
        font-size: 12px;
        line-height: 1.2;
      }

      .page-chip {
        flex: 0 0 auto;
        min-width: 152px;
        max-width: 220px;
        justify-content: flex-start;
        border-radius: 9px;
        padding: 8px 11px;
        text-align: left;
      }

      .page-chip[aria-current="page"] {
        border-color: var(--cyan);
        color: var(--cyan);
      }

      .page-chip strong,
      .page-chip span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .page-chip strong {
        font-size: 12px;
        line-height: 1.15;
      }

      .page-chip span {
        margin-top: 3px;
        color: inherit;
        font-size: 11px;
        line-height: 1.2;
        opacity: 0.82;
      }

      select {
        min-width: 118px;
        padding: 0 12px;
      }

      a:hover,
      button:hover,
      select:hover {
        border-color: var(--cyan);
        color: var(--cyan);
      }

      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 174px);
        border: 0;
      }

      @media (max-width: 860px) {
        header {
          grid-template-columns: 1fr;
          align-items: flex-start;
        }

        .pager,
        nav {
          flex-wrap: wrap;
          justify-content: flex-start;
        }

        iframe {
          height: calc(100vh - 264px);
        }

        .tabs {
          top: 151px;
        }

        .section-pages {
          top: 210px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <div class="brand">NETSIRV</div>
        <h1 id="page-title">SOP & Document Ecosystem</h1>
      </div>
      <div class="pager" aria-label="Page controls">
        <button type="button" id="previous">Previous</button>
        <select id="page-select" aria-label="Select page"></select>
        <button type="button" id="next">Next</button>
      </div>
      <nav aria-label="Deck actions">
        <a id="theme-link" href="#">White</a>
        <a href="./index.html">Hub</a>
        <a id="pdf-link" href="../exports/netsirv-sop-document-ecosystem-rebuilt-dark.pdf">PDF</a>
      </nav>
    </header>
    <div class="tabs" id="tabs" role="tablist" aria-label="Deck sections"></div>
    <div class="section-pages" id="section-pages" aria-label="Pages in selected section"></div>
    <iframe id="slide-frame" title="Netsirv SOP and Document Ecosystem page"></iframe>

    <script>
      const totalPages = 20;
      const pageTitles = [
        "Netsirv SOP & Document Management Ecosystem",
        "The narrative shift",
        "Why this matters now",
        "Why traditional document management falls short",
        "The Netsirv ecosystem model",
        "Universal document intelligence",
        "Mobile turns field work into governed records",
        "SOP + Academy creates a governance differentiator",
        "Documents become relationship-aware business objects",
        "Audit & evidence chain",
        "Accounting is not an afterthought",
        "Exception management keeps work moving",
        "Dashboards that drive behavior",
        "Platform architecture at a glance",
        "Integration without disruption",
        "Implementation roadmap",
        "Pilot program blueprint",
        "Expected outcomes",
        "Who benefits",
        "Let's build what's next",
      ];
      const sections = [
        { label: "Overview", description: "Narrative, urgency, and the limits of legacy document storage.", pages: [1, 2, 3, 4] },
        { label: "Ecosystem", description: "The connected operating model around SOPs and document control.", pages: [5] },
        { label: "Document Intelligence", description: "Intake, relationships, audit evidence, and source-proof chains.", pages: [6, 9, 10] },
        { label: "Field Governance", description: "Mobile capture and Academy controls that turn training into access.", pages: [7, 8] },
        { label: "Finance", description: "Accounting context, exception handling, and behavior-driving metrics.", pages: [11, 12, 13] },
        { label: "Platform", description: "Architecture and integrations for rollout without disruption.", pages: [14, 15] },
        { label: "Roadmap", description: "Implementation phases, pilot plan, and measurable outcomes.", pages: [16, 17, 18] },
        { label: "Outcomes", description: "Who benefits and how to move into the next conversation.", pages: [19, 20] },
      ];

      const params = new URLSearchParams(location.search);
      let page = Math.min(totalPages, Math.max(1, Number(params.get("page")) || 1));
      let theme = params.get("theme") === "light" ? "light" : "dark";

      const body = document.body;
      const frame = document.getElementById("slide-frame");
      const pageSelect = document.getElementById("page-select");
      const pageTitle = document.getElementById("page-title");
      const themeLink = document.getElementById("theme-link");
      const pdfLink = document.getElementById("pdf-link");
      const tabs = document.getElementById("tabs");
      const sectionPages = document.getElementById("section-pages");

      for (let i = 1; i <= totalPages; i += 1) {
        const option = document.createElement("option");
        option.value = String(i);
        option.textContent = `Page ${String(i).padStart(2, "0")}`;
        pageSelect.append(option);
      }

      sections.forEach((section) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tab";
        button.setAttribute("role", "tab");
        button.dataset.section = section.label;
        button.innerHTML = `<strong>${section.label}</strong><span>${section.pages.length} page${section.pages.length === 1 ? "" : "s"}</span>`;
        button.addEventListener("click", () => {
          page = section.pages[0];
          render();
        });
        tabs.append(button);
      });

      function activeSection() {
        return sections.find((section) => section.pages.includes(page)) || sections[0];
      }

      function updateUrl() {
        const nextParams = new URLSearchParams();
        nextParams.set("page", String(page));
        if (theme === "light") nextParams.set("theme", "light");
        history.replaceState(null, "", `?${nextParams.toString()}`);
      }

      function render() {
        body.classList.toggle("light", theme === "light");
        pageSelect.value = String(page);
        pageTitle.textContent = `Page ${String(page).padStart(2, "0")} - ${pageTitles[page - 1]}`;
        themeLink.textContent = theme === "light" ? "Dark" : "White";
        pdfLink.href = theme === "light"
          ? "../exports/netsirv-sop-document-ecosystem-rebuilt-white.pdf"
          : "../exports/netsirv-sop-document-ecosystem-rebuilt-dark.pdf";
        const deckParams = new URLSearchParams({ view: "web", page: String(page) });
        if (theme === "light") deckParams.set("theme", "light");
        frame.src = `../rebuild/deck.html?${deckParams.toString()}`;
        const currentSection = activeSection();
        tabs.querySelectorAll(".tab").forEach((tab) => {
          const selected = tab.dataset.section === currentSection.label;
          tab.setAttribute("aria-selected", String(selected));
          if (selected) tab.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        });
        sectionPages.innerHTML = `<div class="section-heading"><strong>${currentSection.label}</strong><span>${currentSection.description}</span></div>`;
        currentSection.pages.forEach((sectionPage) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "page-chip";
          button.innerHTML = `<strong>Page ${String(sectionPage).padStart(2, "0")}</strong><span>${pageTitles[sectionPage - 1]}</span>`;
          button.setAttribute("aria-current", sectionPage === page ? "page" : "false");
          button.addEventListener("click", () => {
            page = sectionPage;
            render();
          });
          sectionPages.append(button);
        });
        updateUrl();
      }

      document.getElementById("previous").addEventListener("click", () => {
        page = page === 1 ? totalPages : page - 1;
        render();
      });

      document.getElementById("next").addEventListener("click", () => {
        page = page === totalPages ? 1 : page + 1;
        render();
      });

      pageSelect.addEventListener("change", () => {
        page = Number(pageSelect.value);
        render();
      });

      themeLink.addEventListener("click", (event) => {
        event.preventDefault();
        theme = theme === "light" ? "dark" : "light";
        render();
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          page = page === 1 ? totalPages : page - 1;
          render();
        }
        if (event.key === "ArrowRight") {
          page = page === totalPages ? 1 : page + 1;
          render();
        }
      });

      render();
    </script>
  </body>
</html>

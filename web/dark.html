<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netsirv SOP & Document Ecosystem - Dark</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #020713;
        --panel: rgba(5, 11, 22, 0.88);
        --text: #f4f8ff;
        --muted: #9fb2c7;
        --cyan: #26e4ff;
        --line: rgba(45, 226, 255, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        backdrop-filter: blur(18px);
      }

      .title {
        min-width: 0;
      }

      .brand {
        color: var(--cyan);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.14em;
      }

      h1 {
        margin: 2px 0 0;
        overflow: hidden;
        color: var(--text);
        font-size: 18px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text);
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.04);
      }

      a:hover {
        border-color: var(--cyan);
        color: var(--cyan);
      }

      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 68px);
        border: 0;
      }

      @media (max-width: 740px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        nav {
          justify-content: flex-start;
        }

        iframe {
          height: calc(100vh - 126px);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title">
        <div class="brand">NETSIRV</div>
        <h1>SOP & Document Ecosystem - Dark Deck</h1>
      </div>
      <nav aria-label="Deck actions">
        <a href="./white.html">White</a>
        <a href="./page.html">Sections</a>
        <a href="./index.html">Hub</a>
        <a href="../exports/netsirv-sop-document-ecosystem-rebuilt-dark.pdf">PDF</a>
      </nav>
    </header>
    <iframe title="Netsirv SOP and Document Ecosystem dark deck" src="../rebuild/deck.html?view=web"></iframe>
  </body>
</html>

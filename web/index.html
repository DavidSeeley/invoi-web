<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Netsirv | SOP & Document Ecosystem</title>
    <meta name="description" content="Netsirv connects SOPs, document intelligence, workflow, governance, accounting context, mobile operations, and automation into one enterprise operating layer." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050814;
        --panel: #0a1020;
        --text: #f7fbff;
        --muted: #a8b6cc;
        --cyan: #3de7ff;
        --blue: #2f7cff;
        --magenta: #d15cff;
        --line: rgba(83, 210, 255, 0.24);
        --line-strong: rgba(83, 210, 255, 0.46);
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 78% 0%, rgba(209, 92, 255, 0.18), transparent 34rem),
          radial-gradient(circle at 12% 6%, rgba(61, 231, 255, 0.12), transparent 30rem),
          #050814;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      a,
      button {
        color: inherit;
        font: inherit;
      }

      a {
        text-decoration: none;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      .shell {
        width: min(1280px, calc(100% - 40px));
        margin: 0 auto;
        padding: 28px 0 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 28px;
      }

      .brand {
        color: var(--cyan);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
      }

      .deck-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .button {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text);
        font-size: 12px;
        font-weight: 850;
        background: rgba(255, 255, 255, 0.035);
      }

      .button:hover {
        border-color: var(--cyan);
        color: var(--cyan);
      }

      .admin-head {
        padding: 30px 0 0;
        border-bottom: 1px solid rgba(168, 182, 204, 0.22);
      }

      .title-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        color: var(--cyan);
      }

      .mark svg {
        width: 34px;
        height: 34px;
      }

      h1 {
        font-size: clamp(32px, 4vw, 48px);
        line-height: 1.08;
        letter-spacing: -0.015em;
      }

      .tabs {
        display: flex;
        gap: clamp(26px, 5vw, 58px);
        overflow-x: auto;
        margin-top: 38px;
      }

      .tab {
        position: relative;
        flex: 0 0 auto;
        padding: 0 0 22px;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: clamp(19px, 2.4vw, 32px);
        font-weight: 520;
        white-space: nowrap;
      }

      .tab[aria-selected="true"] {
        color: var(--cyan);
      }

      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--cyan), var(--blue));
      }

      .page {
        display: none;
        padding-top: 34px;
      }

      .page.active {
        display: block;
      }

      .page-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 0.45fr);
        gap: 28px;
        align-items: end;
        padding-bottom: 18px;
      }

      .eyebrow,
      .page-kicker {
        color: var(--cyan);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .page-header h2 {
        margin-top: 10px;
        max-width: 760px;
        font-size: clamp(38px, 5vw, 72px);
        line-height: 0.98;
        letter-spacing: -0.02em;
      }

      .page-summary {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        background:
          linear-gradient(145deg, rgba(61, 231, 255, 0.08), rgba(209, 92, 255, 0.06)),
          rgba(255, 255, 255, 0.03);
      }

      .page-summary p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .section {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
        gap: clamp(28px, 5vw, 72px);
        align-items: center;
        min-height: 72vh;
        padding: clamp(46px, 7vw, 84px) 0;
        border-top: 1px solid var(--line);
      }

      .section:nth-of-type(even) .copy {
        order: 2;
      }

      .section:nth-of-type(even) .visual {
        order: 1;
      }

      .copy h3 {
        margin-top: 10px;
        max-width: 680px;
        font-size: clamp(30px, 4.3vw, 58px);
        line-height: 1.02;
        letter-spacing: -0.016em;
      }

      .copy p {
        max-width: 640px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.7;
      }

      .cta {
        width: fit-content;
        display: inline-flex;
        align-items: center;
        margin-top: 18px;
        padding: 12px 15px;
        border: 1px solid var(--cyan);
        border-radius: 12px;
        color: var(--text);
        font-size: 13px;
        font-weight: 850;
        box-shadow: 0 0 28px rgba(61, 231, 255, 0.12);
      }

      .cta:hover {
        color: var(--cyan);
      }

      .visual {
        position: relative;
        overflow: hidden;
        min-height: 360px;
        display: grid;
        align-content: center;
        gap: 14px;
        border: 1px solid var(--line-strong);
        border-radius: 20px;
        padding: 22px;
        background:
          linear-gradient(145deg, rgba(61, 231, 255, 0.09), rgba(209, 92, 255, 0.06)),
          rgba(255, 255, 255, 0.03);
        box-shadow: 0 24px 90px var(--shadow);
      }

      .visual::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(90deg, rgba(61, 231, 255, 0.055) 1px, transparent 1px),
          linear-gradient(rgba(61, 231, 255, 0.045) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: radial-gradient(circle at 78% 42%, black, transparent 68%);
      }

      .visual > * {
        position: relative;
        z-index: 1;
      }

      .viz-grid {
        display: grid;
        gap: 12px;
      }

      .viz-grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .viz-grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .viz-grid.four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .viz-grid.five {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }

      .viz-card,
      .viz-table,
      .viz-step {
        border: 1px solid var(--line);
        border-radius: 13px;
        background: rgba(5, 8, 20, 0.58);
      }

      .viz-card {
        min-height: 112px;
        padding: 14px;
      }

      .viz-card strong {
        display: block;
        color: var(--text);
        font-size: 15px;
        line-height: 1.25;
      }

      .viz-card span,
      .viz-row span,
      .viz-step {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.42;
      }

      .viz-card span {
        display: block;
        margin-top: 7px;
      }

      .viz-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        margin-bottom: 10px;
        border: 1px solid currentColor;
        border-radius: 999px;
        color: var(--cyan);
        font-size: 18px;
        font-weight: 900;
        box-shadow: 0 0 24px color-mix(in srgb, currentColor 22%, transparent);
      }

      .viz-hub {
        width: 178px;
        height: 178px;
        display: grid;
        place-items: center;
        margin: 0 auto;
        border: 1px solid var(--cyan);
        border-radius: 999px;
        color: var(--text);
        text-align: center;
        font-size: 14px;
        font-weight: 900;
        line-height: 1.25;
        background:
          radial-gradient(circle, rgba(61, 231, 255, 0.18), transparent 62%),
          rgba(255, 255, 255, 0.035);
        box-shadow: 0 0 42px rgba(61, 231, 255, 0.25);
      }

      .viz-flow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }

      .viz-arrow {
        color: var(--cyan);
        font-weight: 900;
      }

      .viz-table {
        overflow: hidden;
      }

      .viz-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(83, 210, 255, 0.16);
      }

      .viz-row:last-child {
        border-bottom: 0;
      }

      .viz-row b {
        color: var(--text);
        font-size: 12px;
      }

      .viz-steps {
        display: grid;
        gap: 9px;
      }

      .viz-step {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        align-items: center;
        min-height: 40px;
        padding: 8px 10px;
      }

      .viz-badge {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border: 1px solid currentColor;
        border-radius: 999px;
        color: var(--cyan);
        font-size: 12px;
        font-weight: 900;
      }

      .viz-callout {
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 14px;
        color: var(--cyan);
        font-size: 14px;
        font-weight: 850;
        line-height: 1.45;
        background: rgba(61, 231, 255, 0.055);
      }

      .viz-bars {
        height: 130px;
        display: flex;
        align-items: end;
        gap: 10px;
        padding-top: 18px;
      }

      .viz-bar {
        flex: 1;
        border-radius: 999px 999px 0 0;
        background: linear-gradient(180deg, var(--cyan), var(--blue));
      }

      .viz-ring {
        width: 122px;
        height: 122px;
        display: grid;
        place-items: center;
        margin: 12px auto 0;
        border-radius: 999px;
        background:
          radial-gradient(circle at center, var(--panel) 54%, transparent 55%),
          conic-gradient(var(--cyan) 0 92%, rgba(255, 255, 255, 0.08) 92% 100%);
        color: var(--cyan);
        font-size: 24px;
        font-weight: 900;
      }

      .viz-spark {
        height: 122px;
        margin-top: 16px;
        border-bottom: 1px solid var(--line);
        background:
          linear-gradient(140deg, transparent 0 12%, var(--magenta) 12% 14%, transparent 14% 29%, var(--cyan) 29% 31%, transparent 31% 48%, var(--blue) 48% 50%, transparent 50% 68%, #13e6a3 68% 70%, transparent 70%),
          linear-gradient(180deg, transparent 80%, rgba(61, 231, 255, 0.14));
      }

      .viz-road {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        align-items: stretch;
      }

      .viz-road .viz-card {
        min-height: 170px;
      }

      .viz-target {
        width: 118px;
        height: 118px;
        display: grid;
        place-items: center;
        margin: 10px auto 0;
        border-radius: 999px;
        border: 1px solid var(--magenta);
        color: var(--magenta);
        font-size: 42px;
        box-shadow: 0 0 34px rgba(209, 92, 255, 0.25);
      }

      @media (max-width: 900px) {
        .page-header,
        .section {
          grid-template-columns: 1fr;
        }

        .viz-grid.two,
        .viz-grid.three,
        .viz-grid.four,
        .viz-grid.five,
        .viz-road {
          grid-template-columns: 1fr;
        }

        .viz-flow {
          align-items: stretch;
          flex-direction: column;
        }

        .section:nth-of-type(even) .copy,
        .section:nth-of-type(even) .visual {
          order: initial;
        }
      }

      @media (max-width: 720px) {
        .shell {
          width: min(100% - 28px, 1280px);
          padding-top: 22px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .deck-links {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="brand">NETSIRV</div>
        <nav class="deck-links" aria-label="Deck links">
          <a class="button" href="./page.html">Sectioned Deck</a>
          <a class="button" href="./dark.html">Dark Deck</a>
          <a class="button" href="../exports/netsirv-sop-document-ecosystem-rebuilt-dark.pdf">Dark PDF</a>
          <a class="button" href="../exports/netsirv-sop-document-ecosystem-rebuilt-white.pdf">White PDF</a>
        </nav>
      </div>

      <header class="admin-head">
        <div class="title-row">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M2 14h4"/><path d="M10 8h4"/><path d="M18 16h4"/></svg>
          </div>
          <h1>SOP & Document Ecosystem</h1>
        </div>
        <nav class="tabs" aria-label="Website tabs">
          <button class="tab" type="button" data-page="front" aria-selected="true">Front Pages</button>
          <button class="tab" type="button" data-page="operations" aria-selected="false">Operations</button>
          <button class="tab" type="button" data-page="platform" aria-selected="false">Platform</button>
          <button class="tab" type="button" data-page="roadmap" aria-selected="false">Roadmap</button>
        </nav>
      </header>

      <main id="pages"></main>
    </div>

    <script>
      const pages = [
        {
          id: "front",
          label: "Front Pages",
          title: "From document storage to operational control.",
          summary: "The opening story: why SOPs, documents, evidence, context and ecosystem thinking belong in one connected operating layer.",
          sections: [
            ["Operational Intelligence", "Turn every document, workflow, and SOP into an intelligent business system.", "Netsirv connects SOPs, documents, field activity, accounting context, governance, and automation into one operational layer.", "Explore the ecosystem", "01-sop-document-management-ecosystem.png", "Netsirv SOP & Document Management Ecosystem"],
            ["From storage to intelligence", "Documents should drive work, not just record it.", "Move beyond static folders and disconnected PDFs. Netsirv treats business content as live operational data connected to people, processes, customers, and outcomes.", "See the shift", "02-narrative-shift.png", "The narrative shift"],
            ["Why now", "Back-office complexity is growing faster than headcount should.", "Teams need systems that reduce repetitive coordination, preserve institutional knowledge, and make every process easier to execute consistently.", "See the opportunity", "03-why-this-matters-now.png", "Why this matters now"],
            ["The old model breaks", "Folders organize files. They do not run operations.", "Traditional document systems isolate information from workflow, relationships, approvals, accounting context and evidence.", "Compare the models", "04-traditional-document-management-falls-short.png", "Why traditional document management falls short"],
            ["One connected operating layer", "A unified ecosystem for SOPs, documents, people and workflow.", "Netsirv links content to the enterprise stack so information moves with work instead of sitting outside it.", "View the ecosystem", "05-netsirv-ecosystem-model.png", "The Netsirv ecosystem model"],
          ],
        },
        {
          id: "operations",
          label: "Operations",
          title: "Turn daily work into governed records.",
          summary: "Capture, classify, train, connect and prove work through operational records that carry source evidence.",
          sections: [
            ["AI-ready by design", "Make every business document understandable, searchable and actionable.", "Capture, classify, connect and use information across documents while preserving operational context around each record.", "Explore document intelligence", "06-universal-document-intelligence.png", "Universal document intelligence"],
            ["Field-to-office continuity", "Turn mobile activity into governed business records in real time.", "Photos, signatures, notes, exceptions, approvals and job evidence can flow directly into the system of record from the field.", "See mobile workflows", "07-mobile-governed-records.png", "Mobile turns field work into governed records"],
            ["Train and govern", "Connect what people should do with proof that they know how to do it.", "Pair SOPs with training, certification, role requirements and acknowledgements so policy becomes an operational control.", "Explore governance", "08-sop-academy-governance.png", "SOP + Academy creates a governance differentiator"],
            ["Context everywhere", "A document should know what it belongs to.", "Associate content with customers, jobs, vendors, employees, assets, transactions and workflows so users never have to hunt for context.", "See connected records", "09-relationship-aware-business-objects.png", "Documents become relationship-aware business objects"],
            ["Defensible operations", "Preserve the evidence behind every critical action.", "Maintain the chain of approvals, acknowledgements, uploads, changes and supporting records needed for compliance, claims and review.", "See the evidence chain", "10-audit-evidence-chain.png", "Audit & evidence chain"],
          ],
        },
        {
          id: "platform",
          label: "Platform",
          title: "Connect operations, finance and architecture.",
          summary: "Tie evidence and workflow into accounting context, exception handling, dashboards, architecture and integrations.",
          sections: [
            ["Operational + financial context", "Connect documents and workflow to the financial event they support.", "Invoices, receipts, approvals, job costs, exceptions and supporting records become one traceable operational story.", "Explore accounting context", "11-accounting-context.png", "Accounting is not an afterthought"],
            ["Manage the exceptions", "Design the system for what happens when the normal process breaks.", "Route exceptions to the right person, preserve the evidence, trigger approvals and keep work moving without losing accountability.", "See exception workflows", "12-exception-management.png", "Exception management keeps work moving"],
            ["Operational visibility", "Give every role a dashboard that tells them what needs attention now.", "Surface missing records, overdue acknowledgements, exceptions, approvals, risk signals and performance measures in one actionable view.", "See the dashboards", "13-behavior-driving-dashboards.png", "Dashboards that drive behavior"],
            ["Enterprise architecture", "Built as a connected platform, not another isolated app.", "Use a common data, identity, workflow and integration layer so new capabilities compound instead of creating new silos.", "View the architecture", "14-platform-architecture.png", "Platform architecture at a glance"],
            ["Meet the business where it is", "Integrate with existing systems while modernizing the operating layer.", "Connect to current tools and data sources so modernization can phase in without a disruptive all-at-once replacement.", "Explore integrations", "15-integration-without-disruption.png", "Integration without disruption"],
          ],
        },
        {
          id: "roadmap",
          label: "Roadmap",
          title: "Scale from pilot to organization-wide impact.",
          summary: "A practical rollout path: roadmap, pilot blueprint, measurable outcomes, stakeholder value and the next build step.",
          sections: [
            ["Practical deployment", "Start with high-value workflows and expand from proven wins.", "Sequence implementation around business value, data readiness, governance and user adoption so each phase creates a foundation for the next.", "View the roadmap", "16-implementation-roadmap.png", "Implementation roadmap"],
            ["Prove it quickly", "Choose one workflow, one team and one measurable outcome.", "A focused pilot can validate the operating model, integrations, governance, AI assistance and adoption plan before broader rollout.", "Plan a pilot", "17-pilot-program-blueprint.png", "Pilot program blueprint"],
            ["Business impact", "Reduce friction, improve control and create leverage across the back office.", "The goal is fewer manual handoffs, faster access to context, stronger compliance, better decisions and more scalable operations.", "See expected outcomes", "18-expected-outcomes.png", "Expected outcomes"],
            ["Designed for the whole organization", "One operating model, different value for every role.", "Executives gain visibility, managers gain control, office teams reduce coordination work and field teams get clearer processes with less administrative burden.", "See who benefits", "19-who-benefits.png", "Who benefits"],
            ["Netsirv", "Build an operating system that gets smarter as the business runs.", "Connect the workflows, records, training, evidence, financial context and automation needed to run a modern service business.", "Start the conversation", "20-build-whats-next.png", "Let's build what's next"],
          ],
        },
      ];

      function icon(label, color = "var(--cyan)") {
        return `<div class="viz-icon" style="color:${color}">${label}</div>`;
      }

      function card(title, text, label = "□", color = "var(--cyan)") {
        return `<div class="viz-card">${icon(label, color)}<strong>${title}</strong><span>${text}</span></div>`;
      }

      function grid(columns, cards) {
        return `<div class="viz-grid ${columns}">${cards.join("")}</div>`;
      }

      function table(rows) {
        return `<div class="viz-table">${rows.map(([label, value]) => `<div class="viz-row"><span>${label}</span><b>${value}</b></div>`).join("")}</div>`;
      }

      function steps(items) {
        return `<div class="viz-steps">${items.map((item, index) => `<div class="viz-step"><span class="viz-badge">${index + 1}</span><span>${item}</span></div>`).join("")}</div>`;
      }

      function visualFor(image) {
        switch (image) {
          case "01-sop-document-management-ecosystem.png":
            return `<div class="viz-hub">SOP + DOCUMENT<br>CONTROL CENTER</div><div class="viz-grid four">${["SOP-first", "AI-assisted", "Audit-ready", "Accounting aware"].map((item) => card(item, "Executive control signal", "✓")).join("")}</div><div class="viz-callout">The front door is document management. The strategic outcome is operational control.</div>`;
          case "02-narrative-shift.png":
            return grid("two", [
              card("Old model", "Documents are stored, searched, exported and forgotten. The system cannot prove work was governed.", "▣"),
              card("Netsirv model", "SOPs connect to training, mobile action, evidence, approvals, transactions and financial output.", "◎", "var(--magenta)"),
            ]);
          case "03-why-this-matters-now.png":
            return grid("four", [
              card("SOP drift", "Outdated versions and informal workarounds.", "1"),
              card("Evidence gaps", "Invoices, photos and BOLs separated from the work they support.", "2"),
              card("Manual re-keying", "Financial data typed from disconnected documents.", "3"),
              card("Audit fragility", "Hard to prove procedure, training and evidence in one chain.", "4"),
            ]) + `<div class="viz-callout">The cost is weak control over how work is performed, documented, approved and reported.</div>`;
          case "04-traditional-document-management-falls-short.png":
            return grid("two", [
              `<div class="viz-card"><strong>Traditional DMS</strong>${table([["SOP_Receiving_Final_v3.pdf", "file"], ["Receiving_SOP_2024.docx", "file"], ["BOL Scan 8921.pdf", "file"], ["Invoice HVAC photo.jpg", "file"]])}</div>`,
              `<div class="viz-card"><strong>Netsirv Context Graph</strong>${table([["Active SOP", "v2.1"], ["Trained Users", "42"], ["BOL Evidence", "18"], ["Open Exceptions", "3"], ["GL Impact", "$12.4k"]])}</div>`,
            ]);
          case "05-netsirv-ecosystem-model.png":
            return `<div class="viz-flow"><div>${grid("two", [card("Academy", "Training", "A", "var(--magenta)"), card("Mobile", "Capture", "M"), card("AI documents", "Repository & search", "AI", "var(--magenta)")])}</div><span class="viz-arrow">→</span><div class="viz-hub">SOP + DOCUMENT<br>CONTROL CENTER</div><span class="viz-arrow">→</span><div>${grid("two", [card("Procurement", "Workflow", "$", "#f7c948"), card("Vendors", "Contracts", "V"), card("Accounting", "Output", "GL", "#13e6a3"), card("Catalog", "Master data", "C")])}</div></div>`;
          case "06-universal-document-intelligence.png":
            return grid("two", [`<div>${steps(["Capture original", "Classify document type", "Extract key data", "Score confidence", "Review human-in-loop", "Route to workflow"])}</div>`, `<div class="viz-card"><strong>AI Extraction Review</strong>${table([["Vendor", "ABC HVAC"], ["Date", "08/16/26"], ["Work", "RTU repair"], ["Materials", "$140.20"], ["Total", "$725.00"]])}</div>`]);
          case "07-mobile-governed-records.png":
            return grid("five", ["Procurement", "View SOP", "Scan invoice", "Verify", "Submit"].map((item, i) => card(item, "Simple field step", i + 1))) + `<div class="viz-callout">SOP, invoice, item, truck, service and GL classification are linked.</div>`;
          case "08-sop-academy-governance.png":
            return grid("two", [`<div>${steps(["SOP fulfilled", "Training assigned", "Assessment passed", "Button active"])}</div>`, `<div class="viz-card"><strong>Access status</strong>${table([["Scheduling", "ACTIVE"], ["Orders", "ACTIVE"], ["Procurement", "ACTIVE"], ["HazMat", "TRAINING"]])}</div>`]);
          case "09-relationship-aware-business-objects.png":
            return grid("two", [`<div class="viz-card"><strong>Vendor Service Invoice</strong>${table([["Vendor", "ABC HVAC"], ["Location", "Main Office"], ["Asset", "RTU-006"], ["SOP", "Maintenance SOP"], ["Contract", "2026 MSA"]])}</div>`, `<div class="viz-flow"><div class="viz-hub">Document</div><span class="viz-arrow">↔</span>${steps(["Vendor", "Asset", "SOP", "GL", "Approval"])}</div>`]);
          case "10-audit-evidence-chain.png":
            return grid("five", [card("SOP", "Governing procedure", "S"), card("Training", "Readiness proof", "T", "var(--magenta)"), card("Device", "Source capture", "D"), card("Document", "Evidence", "E"), card("GL", "Financial output", "GL", "#f7c948")]) + `<div class="viz-callout">Evidence is captured at the source, not bolted on after the fact.</div>`;
          case "11-accounting-context.png":
            return grid("two", [`<div class="viz-card"><strong>Operational Event</strong>${steps(["Service invoice approved", "SOP followed", "User trained", "Evidence captured", "Approval obtained"])}</div>`, `<div class="viz-card"><strong>Accounting Impact</strong>${table([["GL Account", "6300"], ["Service Expense", "$725"], ["Location", "Main Office"], ["Asset", "RTU-006"], ["Vendor", "ABC HVAC"]])}</div>`]);
          case "12-exception-management.png":
            return grid("two", [grid("two", [card("Price mismatch", "Invoice + contract", "!", "var(--magenta)"), card("Item not found", "Not in master data", "?", "var(--blue)"), card("Damaged goods", "Container exception", "!", "#fb923c"), card("Policy exception", "Requires approval", "P", "#13e6a3")]), `<div>${steps(["Route to right approver", "Decision recorded", "Continue or adjust", "Evidence retained"])}</div>`]);
          case "13-behavior-driving-dashboards.png":
            return grid("three", [`<div class="viz-card"><strong>Operations</strong><div class="viz-bars">${[35, 48, 28, 66, 54, 82].map((h) => `<span class="viz-bar" style="height:${h}%"></span>`).join("")}</div></div>`, `<div class="viz-card"><strong>Compliance</strong><div class="viz-ring">92%</div></div>`, `<div class="viz-card"><strong>Finance</strong><div class="viz-spark"></div></div>`]);
          case "14-platform-architecture.png":
            return grid("three", [card("Web Portal", "User interface", "W"), card("Mobile Apps", "Field capture", "M"), card("API Gateway", "Secure access", "API"), card("AI Services", "Extraction & review", "AI", "var(--magenta)"), card("Workflow Engine", "Approvals", "WF"), card("Integration Layer", "Connectors", "I")]) + `<div class="viz-callout">Data layers: metadata, relationships, audit and transactions.</div>`;
          case "15-integration-without-disruption.png":
            return `<div class="viz-flow"><div class="viz-card"><strong>Existing systems</strong>${steps(["ERP / Accounting", "Purchasing / P2P", "HR / LMS", "Asset Management"])}</div><span class="viz-arrow">→</span><div class="viz-hub">NETSIRV<br>Integration<br>Layer</div><span class="viz-arrow">→</span><div class="viz-card"><strong>APIs</strong>${steps(["Webhooks", "SFTP / File", "Standard connectors", "Secure by design"])}</div></div>`;
          case "16-implementation-roadmap.png":
            return `<div class="viz-road">${["Foundation", "Mobile & AI", "Accounting", "Optimization", "Scale"].map((item, index) => card(`Phase ${index + 1}`, item, index + 1, ["var(--cyan)", "var(--magenta)", "#13e6a3", "#f7c948", "#fb7185"][index])).join("")}</div><div class="viz-callout">Each phase is useful on day one and builds toward a fully connected operational platform.</div>`;
          case "17-pilot-program-blueprint.png":
            return grid("two", [`<div class="viz-card"><strong>Pilot Scope</strong>${table([["Scope", "One process, one location"], ["Duration", "8 - 12 weeks"], ["Participants", "10 - 12 users"], ["Success", "Adoption, accuracy, time savings"]])}</div>`, `<div class="viz-card"><strong>Pilot Outcomes</strong>${steps(["Validated process", "Trained users", "Connected data", "Measurable results", "Plan to scale"])}<div class="viz-target">◎</div></div>`]);
          case "18-expected-outcomes.png":
            return grid("five", [card("30 - 50%", "Less manual data entry", "%"), card("20 - 40%", "Faster invoice processing", "⏱"), card("25 - 60%", "Fewer exceptions", "↓"), card("100%", "Audit-ready evidence chain", "✓"), card("Stronger", "Compliance and governance", "◎")]);
          case "19-who-benefits.png":
            return grid("five", ["Employees", "Managers", "Finance", "IT", "Executives"].map((role) => card(role, "Connected work, clear evidence and better outcomes.", "○")));
          case "20-build-whats-next.png":
            return grid("two", [`<div>${steps(["Start with a conversation", "Define your pilot", "Deliver quick wins", "Scale with confidence"])}</div>`, `<div class="viz-hub">Letivi + invoi<br>AI INFUSED SOP</div>`]) + `<div class="viz-callout">Work governed. Evidence connected. Outcomes delivered.</div>`;
          default:
            return `<div class="viz-callout">Native section visual pending.</div>`;
        }
      }

      function sectionMarkup(section) {
        const [eyebrow, headline, body, cta, image] = section;
        return `<section class="section">
          <div class="copy">
            <div class="eyebrow">${eyebrow}</div>
            <h3>${headline}</h3>
            <p>${body}</p>
            <a class="cta" href="#">${cta}</a>
          </div>
          <div class="visual">
            ${visualFor(image)}
          </div>
        </section>`;
      }

      document.getElementById("pages").innerHTML = pages
        .map((page, index) => `<article id="${page.id}" class="page ${index === 0 ? "active" : ""}">
          <header class="page-header">
            <div>
              <div class="page-kicker">NETSIRV / ${page.label}</div>
              <h2>${page.title}</h2>
            </div>
            <aside class="page-summary"><p>${page.summary}</p></aside>
          </header>
          ${page.sections.map(sectionMarkup).join("")}
        </article>`)
        .join("");

      const tabs = document.querySelectorAll(".tab");
      const articles = document.querySelectorAll(".page");

      function showPage(id) {
        tabs.forEach((tab) => tab.setAttribute("aria-selected", String(tab.dataset.page === id)));
        articles.forEach((article) => article.classList.toggle("active", article.id === id));
        const url = new URL(location);
        url.searchParams.set("page", id);
        history.replaceState(null, "", url);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      tabs.forEach((tab) => tab.addEventListener("click", () => showPage(tab.dataset.page)));

      const initial = new URLSearchParams(location.search).get("page");
      if (initial && document.getElementById(initial)) showPage(initial);
    </script>
  </body>
</html>
